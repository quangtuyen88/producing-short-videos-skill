<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Pip — cyan fox host">
  <!-- Transparent bust, circular-crop friendly; original Pip mascot (not VOICEVOX) -->
  <g transform="translate(128 138)">
    <!-- body -->
    <ellipse cx="0" cy="78" rx="62" ry="48" fill="#00C8BE" stroke="#0A2A30" stroke-width="6"/>
    <ellipse cx="0" cy="86" rx="38" ry="28" fill="#F4FFFE"/>

    <!-- head -->
    <circle cx="0" cy="0" r="72" fill="#00D4C8" stroke="#0A2A30" stroke-width="6"/>

    <!-- ears -->
    <path d="M-58 -48 L-78 -108 L-22 -70 Z" fill="#00D4C8" stroke="#0A2A30" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-62 -58 L-70 -92 L-36 -72 Z" fill="#7EF0E8"/>
    <path d="M58 -48 L78 -108 L22 -70 Z" fill="#00D4C8" stroke="#0A2A30" stroke-width="6" stroke-linejoin="round"/>
    <path d="M62 -58 L70 -92 L36 -72 Z" fill="#7EF0E8"/>

    <!-- muzzle -->
    <ellipse cx="0" cy="22" rx="36" ry="28" fill="#F4FFFE"/>

    <!-- freckle spots -->
    <circle cx="-42" cy="-8" r="7" fill="#7EF0E8"/>
    <circle cx="-30" cy="10" r="4.5" fill="#7EF0E8"/>
    <circle cx="42" cy="-8" r="7" fill="#7EF0E8"/>
    <circle cx="30" cy="10" r="4.5" fill="#7EF0E8"/>

    <!-- eyes -->
    <ellipse cx="-24" cy="-8" rx="16" ry="18" fill="#0A2A30"/>
    <ellipse cx="24" cy="-8" rx="16" ry="18" fill="#0A2A30"/>
    <ellipse cx="-24" cy="-6" rx="9" ry="10" fill="#1AD4C8"/>
    <ellipse cx="24" cy="-6" rx="9" ry="10" fill="#1AD4C8"/>
    <circle cx="-28" cy="-12" r="4.5" fill="#FFFFFF"/>
    <circle cx="20" cy="-12" r="4.5" fill="#FFFFFF"/>
    <circle cx="-20" cy="-2" r="2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="28" cy="-2" r="2" fill="#FFFFFF" opacity="0.85"/>

    <!-- brows -->
    <path d="M-38 -28 Q-24 -34 -12 -28" stroke="#0A2A30" stroke-width="4" stroke-linecap="round"/>
    <path d="M12 -28 Q24 -34 38 -28" stroke="#0A2A30" stroke-width="4" stroke-linecap="round"/>

    <!-- nose + mouth -->
    <ellipse cx="0" cy="14" rx="8" ry="6" fill="#0A2A30"/>
    <path d="M0 20 Q-12 32 -18 28" stroke="#0A2A30" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M0 20 Q12 32 18 28" stroke="#0A2A30" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M-10 30 Q0 40 10 30" fill="#FF6B8A" stroke="#0A2A30" stroke-width="2.5"/>
    <path d="M-4 34 L0 30 L4 34" fill="#FFFFFF" opacity="0.9"/>

    <!-- cheeks -->
    <ellipse cx="-48" cy="18" rx="10" ry="6" fill="#7EF0E8" opacity="0.55"/>
    <ellipse cx="48" cy="18" rx="10" ry="6" fill="#7EF0E8" opacity="0.55"/>

    <!-- headset band -->
    <path d="M-68 -20 Q0 -78 68 -20" stroke="#1A1F24" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M-68 -20 Q0 -78 68 -20" stroke="#2A3238" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- ear cups -->
    <circle cx="-70" cy="-6" r="16" fill="#1A1F24" stroke="#0A2A30" stroke-width="4"/>
    <circle cx="-70" cy="-6" r="9" fill="#00E5C8"/>
    <circle cx="70" cy="-6" r="16" fill="#1A1F24" stroke="#0A2A30" stroke-width="4"/>
    <circle cx="70" cy="-6" r="9" fill="#00E5C8"/>

    <!-- boom mic -->
    <path d="M70 4 Q78 28 42 42" stroke="#1A1F24" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="44" r="7" fill="#00E5C8" stroke="#0A2A30" stroke-width="3"/>
  </g>
</svg>
